name: Free public Windows acceptance
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: free-retail-cross-pc
  cancel-in-progress: false
env:
  GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
jobs:
  first:
    if: github.event.repository.private == false && !contains(github.event.head_commit.message, '[review-only]')
    runs-on: windows-2022
    timeout-minutes: 15
    outputs:
      handoff: ${{ steps.handoff.outputs.data }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch live catalog and download actual published archive
        timeout-minutes: 5
        shell: pwsh
        run: ./qa/cross-pc/prepare.ps1 download
      - name: Verify installer checksum and perform actual silent installation
        timeout-minutes: 3
        shell: pwsh
        run: ./qa/cross-pc/prepare.ps1 extract
      - name: Run real membership and owned-process tests with installed source
        shell: pwsh
        run: |
          $app = Join-Path (Split-Path $env:QA_EXE) 'resources/app'
          New-Item -ItemType Directory -Path (Join-Path $app 'test') -Force | Out-Null
          Copy-Item 'qa/cross-pc/client-tests/*.js' (Join-Path $app 'test')
          node --test "$app/test/retail-license.test.js" "$app/test/retail-support.test.js" "$app/test/retail-gate.test.js"
          if ($LASTEXITCODE -ne 0) { throw 'Installed-source membership tests failed' }
      - name: Prepare disposable localhost HTTPS certificate
        timeout-minutes: 1
        shell: pwsh
        run: ./qa/cross-pc/prepare.ps1 certificate
      - name: Run first independent Windows acceptance
        shell: pwsh
        run: node qa/cross-pc/run-windows.mjs first
      - name: Pass small synthetic state directly through job outputs
        id: handoff
        shell: pwsh
        run: node qa/cross-pc/handoff.mjs export
      - name: Write evidence to free job log and summary
        if: always()
        shell: pwsh
        run: node qa/cross-pc/report.mjs first
  second:
    needs: first
    if: github.event.repository.private == false && !contains(github.event.head_commit.message, '[review-only]')
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch live catalog and download actual published archive
        timeout-minutes: 5
        shell: pwsh
        run: ./qa/cross-pc/prepare.ps1 download
      - name: Verify installer checksum and perform actual silent installation
        timeout-minutes: 3
        shell: pwsh
        run: ./qa/cross-pc/prepare.ps1 extract
      - name: Run real membership and owned-process tests with installed source
        shell: pwsh
        run: |
          $app = Join-Path (Split-Path $env:QA_EXE) 'resources/app'
          New-Item -ItemType Directory -Path (Join-Path $app 'test') -Force | Out-Null
          Copy-Item 'qa/cross-pc/client-tests/*.js' (Join-Path $app 'test')
          node --test "$app/test/retail-license.test.js" "$app/test/retail-support.test.js" "$app/test/retail-gate.test.js"
          if ($LASTEXITCODE -ne 0) { throw 'Installed-source membership tests failed' }
      - name: Prepare disposable localhost HTTPS certificate
        timeout-minutes: 1
        shell: pwsh
        run: ./qa/cross-pc/prepare.ps1 certificate
      - name: Import only synthetic protocol state and encrypted test profile
        shell: pwsh
        env:
          QA_HANDOFF_DATA: ${{ needs.first.outputs.handoff }}
        run: node qa/cross-pc/handoff.mjs import
      - name: Run second independent Windows acceptance
        shell: pwsh
        run: node qa/cross-pc/run-windows.mjs second
      - name: Write evidence to free job log and summary
        if: always()
        shell: pwsh
        run: node qa/cross-pc/report.mjs second
